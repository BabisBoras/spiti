<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Διαμέρισμα</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
body{margin:0;padding:12px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f3ef;color:#2c2c2a;}
button{font:inherit;font-size:14px;padding:8px 12px;border:1px solid #c9c4bb;border-radius:8px;background:#fff;color:#2c2c2a;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
button:active{transform:scale(0.98);background:#f0ede8;}
input[type=range]{width:100%;accent-color:#8a7d6b;}
input[type=number],#cHex{font:inherit;font-size:14px;padding:6px;border:1px solid #c9c4bb;border-radius:8px;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
#wrap{position:relative;width:100%;height:70vh;min-height:420px;border-radius:12px;overflow:hidden;border:1px solid #d6d1c8;touch-action:none;}
.panel{max-width:620px;}
.box{margin-top:10px;padding:12px;border:1px solid #d6d1c8;border-radius:12px;background:#fff;}
</style>
<script>window.onerror=function(m,s,l){var i=document.getElementById('info');if(i)i.textContent='Σφάλμα: '+m+' (γραμμή '+l+')';};</script>
<script src="config.js"></script>
</head>
<body>
<h2 class="sr-only">Τρισδιάστατο μοντέλο διαμερίσματος</h2>
<div id="wrap">
<canvas id="c" tabindex="0" style="width:100%;height:100%;display:block;outline:none;"></canvas>
<div id="info" style="position:absolute;left:8px;top:8px;font-size:12px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,0.88);color:#2C2C2A;">Φόρτωση…</div>
</div>
<div class="panel">
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px;">
<div style="display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:6px;user-select:none;-webkit-user-select:none;">
<span></span><button data-k="f" aria-label="Μπροστά"><i class="ti ti-arrow-up"></i></button><span></span>
<button data-k="l" aria-label="Στροφή αριστερά"><i class="ti ti-arrow-left"></i></button>
<button data-k="b" aria-label="Πίσω"><i class="ti ti-arrow-down"></i></button>
<button data-k="r" aria-label="Στροφή δεξιά"><i class="ti ti-arrow-right"></i></button>
</div>
<div style="display:flex;flex-direction:column;gap:6px;">
<button id="view"><i class="ti ti-map"></i> Κάτοψη</button>
<button id="reset"><i class="ti ti-door"></i> Είσοδος</button>
<button id="night"><i class="ti ti-moon"></i> Βράδυ</button>
</div>
</div>
<div style="display:grid;grid-template-columns:auto minmax(0,1fr) 52px;gap:8px 10px;align-items:center;margin-top:12px;font-size:13px;">
<label for="dim" style="color:#6b6760;"><i class="ti ti-bulb"></i> Φωτεινότητα</label><input type="range" id="dim" min="0" max="100" step="1" value="80"><span id="dimO" style="font-weight:500;">80%</span>
<label for="kel" style="color:#6b6760;"><i class="ti ti-temperature"></i> Θερμότητα</label><input type="range" id="kel" min="2700" max="6000" step="100" value="3000"><span id="kelO" style="font-weight:500;">3000K</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">
<button data-up="floor"><i class="ti ti-photo"></i> Δάπεδο</button>
<button data-up="counter"><i class="ti ti-photo"></i> Πάγκος</button>
<button data-up="splash"><i class="ti ti-photo"></i> Πλάτη</button>
<button data-up="bathA"><i class="ti ti-photo"></i> Μπάνιο</button>
<button data-up="bathB"><i class="ti ti-photo"></i> Ανάγλυφο</button>
<input id="tileIn" type="file" accept="image/*" style="display:none;">
</div>
<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">
<button data-col="wall"><i class="ti ti-palette"></i> Χρώμα τοίχων</button>
<button data-col="door"><i class="ti ti-palette"></i> Χρώμα πορτών</button>
<button id="cfgBtn"><i class="ti ti-settings"></i> Ρυθμίσεις</button>
</div>
<div id="colPanel" class="box" style="display:none;">
<div id="colTitle" style="font-weight:500;margin-bottom:8px;">Χρώμα τοίχων</div>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
<input type="color" id="cPick" aria-label="Παλέτα χρώματος" style="width:56px;height:42px;padding:0;border:none;background:none;">
<label style="font-size:13px;">HEX <input id="cHex" maxlength="7" style="width:96px;"></label>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:13px;align-items:center;">
<label>R <input id="cR" type="number" min="0" max="255" step="1" style="width:64px;"></label>
<label>G <input id="cG" type="number" min="0" max="255" step="1" style="width:64px;"></label>
<label>B <input id="cB" type="number" min="0" max="255" step="1" style="width:64px;"></label>
</div>
<div id="cErr" style="color:#a32d2d;font-size:13px;min-height:18px;margin-top:6px;"></div>
<div style="display:flex;gap:6px;"><button id="cReset">Επαναφορά</button><button id="cClose">Κλείσιμο</button></div>
</div>
<div id="cfgBox" class="box" style="display:none;">
<div style="font-weight:500;margin-bottom:6px;">Περιεχόμενο για το config.js</div>
<textarea id="cfgTa" readonly style="width:100%;height:190px;font-family:monospace;font-size:12px;box-sizing:border-box;border:1px solid #c9c4bb;border-radius:8px;padding:8px;"></textarea>
<div style="display:flex;gap:6px;align-items:center;margin-top:6px;"><button id="cfgCopy">Αντιγραφή</button><button id="cfgClose">Κλείσιμο</button><span id="cfgMsg" style="font-size:12px;color:#6b6760;"></span></div>
</div>
<p style="font-size:12px;color:#6b6760;margin:8px 0 0;">Βελάκια ή WASD για κίνηση, σύρε για να κοιτάξεις γύρω. Για πλακάκια, φωτογραφία ενός πλακιδίου. Για τον πάγκο, φωτογραφία της πλάκας.</p>
</div>
